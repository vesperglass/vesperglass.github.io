<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">World Relationship Index: connections with evidence boundaries</title>
  <desc id="desc">A dark archival field holds six named cards connected by fine brass lines. A separate legend distinguishes recorded relationships, named places, and questions left open; the graphic is an index, not a geographic route map.</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1"><stop stop-color="#152b38"/><stop offset="1" stop-color="#07131e"/></linearGradient>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f5efdf"/><stop offset="1" stop-color="#ded1b6"/></linearGradient>
  </defs>
  <rect width="1200" height="760" rx="24" fill="url(#night)"/>
  <path d="M48 44h1104v672H48z" fill="none" stroke="#9b8059" stroke-width="2"/>
  <text x="78" y="98" fill="#d9c59d" font-family="Georgia,serif" font-size="20" letter-spacing="5">REFERENCE PLATE · RELATIONSHIPS</text>
  <text x="78" y="143" fill="#f3ecdd" font-family="Georgia,serif" font-size="38">Connections, not coordinates</text>
  <g stroke="#b99766" stroke-width="3" fill="none" opacity=".86">
    <path d="M265 283H438M590 283H762M265 283L343 485M514 348V424M838 348V424M916 283L840 484"/>
    <path d="M438 283L515 485M762 283L675 485" stroke-dasharray="8 10" opacity=".6"/>
  </g>
  <g fill="#8bd5ce" stroke="#f3e8cd" stroke-width="2">
    <circle cx="265" cy="283" r="9"/><circle cx="514" cy="283" r="9"/><circle cx="838" cy="283" r="9"/>
    <circle cx="343" cy="485" r="9"/><circle cx="514" cy="485" r="9"/><circle cx="675" cy="485" r="9"/><circle cx="840" cy="485" r="9"/>
  </g>
  <g font-family="Georgia,serif" text-anchor="middle">
    <g><rect x="155" y="212" width="220" height="70" rx="8" fill="url(#paper)"/><text x="265" y="255" fill="#17303a" font-size="21">Starshards</text></g>
    <g><rect x="404" y="212" width="220" height="70" rx="8" fill="url(#paper)"/><text x="514" y="255" fill="#17303a" font-size="21">Tideglass Foundry</text></g>
    <g><rect x="728" y="212" width="220" height="70" rx="8" fill="url(#paper)"/><text x="838" y="255" fill="#17303a" font-size="21">Gate train</text></g>
    <g><rect x="233" y="485" width="220" height="70" rx="8" fill="url(#paper)"/><text x="343" y="528" fill="#17303a" font-size="21">Train Dock</text></g>
    <g><rect x="404" y="485" width="220" height="70" rx="8" fill="url(#paper)"/><text x="514" y="528" fill="#17303a" font-size="21">Vesperglass Gate</text></g>
    <g><rect x="565" y="485" width="220" height="70" rx="8" fill="url(#paper)"/><text x="675" y="528" fill="#17303a" font-size="21">Workshop</text></g>
    <g><rect x="730" y="485" width="220" height="70" rx="8" fill="url(#paper)"/><text x="840" y="528" fill="#17303a" font-size="21">Distant worlds</text></g>
  </g>
  <path d="M90 630h1020" stroke="#735c3f"/>
  <g font-family="Arial,sans-serif" font-size="15" letter-spacing="1.6" fill="#e4d7bd">
    <path d="M102 670h56" stroke="#d2b17d" stroke-width="3"/><text x="174" y="675">RECORDED CONNECTION</text>
    <path d="M438 670h56" stroke="#d2b17d" stroke-width="3" stroke-dasharray="7 7"/><text x="510" y="675">CROSS-REFERENCE ONLY</text>
    <text x="834" y="675" fill="#8bd5ce">ROUTES &amp; COORDINATES UNASSIGNED</text>
  </g>
</svg>
