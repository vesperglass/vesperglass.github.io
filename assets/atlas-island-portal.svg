<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Vesperglass Gate and portal train station</title>
  <desc id="desc">A glowing cyan portal, a connected glass-and-bronze train station, and a short rail spur on one floating isometric island.</desc>
