    <linearGradient id="deck" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#dde9e4"/><stop offset=".32" stop-color="#aabbb4"/><stop offset="1" stop-color="#667d7d"/></linearGradient>
    <linearGradient id="brass" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f4d59a"/><stop offset=".42" stop-color="#c18a53"/><stop offset="1" stop-color="#694b35"/></linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#83e6e1" stop-opacity=".88"/><stop offset=".5" stop-color="#367782" stop-opacity=".62"/><stop offset="1" stop-color="#182d41" stop-opacity=".92"/></linearGradient>
