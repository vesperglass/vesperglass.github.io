<details class="galaxy-map-key">
  <summary aria-label="Open map key and filters"><span aria-hidden="true">☷</span> Map key</summary>
  <div class="galaxy-map-key__panel">
    <fieldset class="galaxy-map-key__filters">
      <legend>Show on map</legend>
      <label><input type="checkbox" data-galaxy-filter="stars" checked> <span class="galaxy-map-key__symbol galaxy-map-key__symbol--star" aria-hidden="true"></span> Stars</label>
      <label><input type="checkbox" data-galaxy-filter="planets" checked> <span class="galaxy-map-key__symbol galaxy-map-key__symbol--planet" aria-hidden="true"></span> Planets and orbits</label>
      <label><input type="checkbox" data-galaxy-filter="portal" checked> <span class="galaxy-map-key__symbol galaxy-map-key__symbol--portal" aria-hidden="true"></span> Vesperglass portal</label>
    </fieldset>
    <div class="galaxy-map-key__legend" aria-label="Star colors">
      <span class="galaxy-map-key__legend-title">STAR TYPES</span>
      <span><i class="galaxy-map-key__dot galaxy-map-key__dot--o" aria-hidden="true"></i> Blue giant</span>
      <span><i class="galaxy-map-key__dot galaxy-map-key__dot--a" aria-hidden="true"></i> White star</span>
      <span><i class="galaxy-map-key__dot galaxy-map-key__dot--f" aria-hidden="true"></i> Pale star</span>
      <span><i class="galaxy-map-key__dot galaxy-map-key__dot--g" aria-hidden="true"></i> Yellow star</span>
      <span><i class="galaxy-map-key__dot galaxy-map-key__dot--k" aria-hidden="true"></i> Amber star</span>
      <span><i class="galaxy-map-key__dot galaxy-map-key__dot--m" aria-hidden="true"></i> Red dwarf</span>
    </div>
    <button class="galaxy-map-key__reset" type="button" data-galaxy-filter-reset>Show all</button>
  </div>
</details>
